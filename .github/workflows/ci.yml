      - run: npm run check:module-characterization
      - run: npm run check:visual-layer-characterization
      - run: npm run check:asset-weight-characterization
      - run: npm run check:strict
      - run: npm test
      - name: Validate frontend environment contract
        run: npm run check:vite-env
        env:
          VITE_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiJ9.synthetic-public-payload.synthetic-signature
          VITE_SUPABASE_PROJECT_ID: abcdefghijklmnopqrst
      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiJ9.synthetic-public-payload.synthetic-signature
          VITE_SUPABASE_PROJECT_ID: abcdefghijklmnopqrst
      - name: Enforce final hosted supply-chain owner disposition
        env:
          XOT_REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          XOT_SUPPLY_OWNER_POLICY_MODE: exact-head
          XOT_SUPPLY_OWNER_POLICY_B64: ${{ vars.XOT_SUPPLY_OWNER_POLICY_B64 }}
        run: node scripts/collect-supply-chain-evidence.mjs --validate-only --output-dir "$RUNNER_TEMP/xot-supply-chain"
      - name: Upload accepted hosted supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xot-supply-chain-accepted-${{ github.event.pull_request.head.sha || github.sha }}
